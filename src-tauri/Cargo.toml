[package]
name = "susuko-bunko"
version = "0.13.2"
description = "Susuko Bunko - light novel and manga reader"
edition = "2021"

[lib]
name = "susuko_bunko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.build-dependencies]
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
# 百度网盘设备直连用的原生下载（用 rustls，安卓上不依赖系统 OpenSSL）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
